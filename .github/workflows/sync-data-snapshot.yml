name: Sync data snapshot

# Copies the newest Coolify backup in R2 to a stable `latest.dmp` filename
# so contributors can always pull from the same URL.

on:
  schedule:
    # Runs daily at 06:00 UTC. Coolify takes its daily backup overnight UTC,
    # so this picks up whatever's freshest each morning.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-data-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-latest:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: psxworth-data-public
      R2_PREFIX: data/coolify/backups/databases/root-team-0/db-market-data-service-i0s88oockow0k4o8k8sgw4gs/
    steps:
      - name: Find newest backup
        id: find
        run: |
          set -euo pipefail

          LATEST_KEY=$(aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET" \
            --prefix "$R2_PREFIX" \
            --endpoint-url "$R2_ENDPOINT" \
            --query 'Contents[?ends_with(Key, `.dmp`)] | sort_by(@, &LastModified)[-1].Key' \
            --output text)

          if [ -z "$LATEST_KEY" ] || [ "$LATEST_KEY" = "None" ]; then
            echo "::error::No .dmp files found under $R2_PREFIX"
            exit 1
          fi

          echo "Latest backup: $LATEST_KEY"
          echo "latest_key=$LATEST_KEY" >> "$GITHUB_OUTPUT"

      - name: Copy to latest.dmp
        env:
          LATEST_KEY: ${{ steps.find.outputs.latest_key }}
        run: |
          set -euo pipefail

          aws s3 cp \
            "s3://$R2_BUCKET/$LATEST_KEY" \
            "s3://$R2_BUCKET/latest.dmp" \
            --endpoint-url "$R2_ENDPOINT"

          echo "✓ Copied $LATEST_KEY → latest.dmp"
