name: GHCR Cleanup

on:
  schedule:
    # Weekly cleanup at 03:30 UTC on Sundays
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old untagged GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: networth
          package-type: container
          min-versions-to-keep: 20
          delete-only-untagged-versions: "true"
